name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat > "$NOTES_FILE" <<'NOTES'
          ## Install

          | Use case | Command |
          |----------|---------|
          | Global CLI + MCP | `npm install -g @truss-security/truss-agent-mcp` |
          | MCP in Cursor (npx) | `npx -y @truss-security/truss-agent-mcp mcp` |
          | CLI one-liner | `npx -y @truss-security/truss-agent-mcp search` |

          ## Quick start

          ```bash
          truss-mcp init
          truss-mcp doctor
          truss-mcp search
          ```

          ## MCP host config

          ```json
          {
            "mcpServers": {
              "truss-mcp": {
                "command": "npx",
                "args": ["-y", "@truss-security/truss-agent-mcp", "mcp"],
                "env": { "TRUSS_API_KEY": "YOUR_KEY" }
              }
            }
          }
          ```
          NOTES
          echo "" >> "$NOTES_FILE"
          echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${VERSION}/CHANGELOG.md) for full release notes." >> "$NOTES_FILE"
          gh release create "$GITHUB_REF_NAME" --title "v${VERSION}" --notes-file "$NOTES_FILE"
